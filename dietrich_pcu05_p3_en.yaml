--- # De Dietrich / Remeha boiler with a PCU-05 control board, parameter set P3
#
# The PCU-05 speaks the Remeha protocol (protocol.nr 1 in Recom's
# DeviceConfiguration.xml), the same one the mcr3 variant uses. Its sample block
# is a superset of the Avanta/Calenta maps, so `variant: pcu05_p3` adds the
# extra fields and applies the bit inversions Recom defines for this board.
#
# Board here is an ESP32 DevKit V4; for a Wemos D1 (ESP8266) swap the `esp32:`
# block for:
#   esp8266:
#     board: d1_mini
# and put the bus on the hardware UART (tx_pin GPIO1 / rx_pin GPIO3).

esphome:
  name: dietrich-pcu05

esp32:
  board: az-delivery-devkit-v4

wifi:
  ssid: "ssid"
  password: "password"

# NOTE (ESP32): keep the logger on its default UART0/USB console. Do NOT use
# `hardware_uart: UART1` - on classic ESP32 boards UART1 defaults to
# GPIO9/GPIO10, which are wired to the internal SPI flash, and touching them
# crashes the board in a boot loop (see issue #7).
logger:

web_server:

api:

ota:
  platform: esphome

external_components:
  - source: github://kakaki/esphome_dietrich
    components: [ dietrich ]
  # or locally, when this YAML lives inside a clone of the repository:
  # - source: components

# Boiler bus on UART2 (GPIO16/GPIO17) - leaves UART0 free for the USB console
uart:
  id: uart_bus
  baud_rate: 9600
  tx_pin: GPIO17
  rx_pin: GPIO16

dietrich:
  # needed only so the bring-up buttons at the bottom can reach the component
  id: boiler
  uart_id: uart_bus
  update_interval: 15s
  variant: pcu05_p3

  # Writing to the boiler's EEPROM is off by default and has to be turned on
  # deliberately. With it off, every write method refuses and says so in the
  # log, and the component never unlocks service mode. Read
  # mapping/pcu05_p3_protocol.md before turning it on: the component will not
  # write the gas/air settings or the controller-protection limits at all,
  # because a bad write there is a combustion-safety problem rather than a
  # comfort one.
  
  # allow_writes: true

  # Status registers. The *_text sensors decode the numeric code into the same
  # wording Recom shows, so no template lambdas are needed.
  state:
    name: "Boiler state code"
  state_text:
    name: "Boiler state"
  sub_state:
    name: "Boiler sub state code"
  sub_state_text:
    name: "Boiler sub state"
  lockout:
    name: "Boiler lockout code"
  lockout_text:
    name: "Boiler lockout"
  blocking:
    name: "Boiler blocking code"
  blocking_text:
    name: "Boiler blocking"

  # Temperatures
  flow_temp:
    name: "Boiler flow temp"
  return_temp:
    name: "Boiler return temp"
  # dhw_in_temp and dhw_flowrate are combi (flow-through DHW) fields. On a solo
  # boiler feeding a cylinder through the 3-way valve the sensor is absent, so
  # dhw_in_temp publishes "unknown" and dhw_flowrate sits at 0 - calorifier_temp
  # is the DHW temperature there.
  dhw_in_temp:
    name: "Boiler DHW in temp"
  outside_temp:
    name: "Boiler outside temp"
  calorifier_temp:
    name: "Boiler calorifier temp"
  boiler_control_temp:
    name: "Boiler control temp (internal)"
  room_temp:
    name: "Boiler room temp"
  control_temp:
    name: "Boiler control temp"
  solar_temp:
    name: "Boiler solar temp"

  # Setpoints
  ch_setpoint:
    name: "Boiler setpoint CH"
  dhw_setpoint:
    name: "Boiler setpoint DHW"
  room_temp_setpoint:
    name: "Boiler setpoint room"
  internal_setpoint:
    name: "Boiler internal setpoint"
  ch_setpoint_hmi:
    name: "Boiler setpoint CH (HMI)"
  dhw_setpoint_hmi:
    name: "Boiler setpoint DHW (HMI)"

  # Fan / airflow. fan_speed_setpoint and fan_speed are the airflow pair at data
  # offsets 22/24; fan_speed_rpm is the dedicated rpm field at offset 44.
  fan_speed_setpoint:
    name: "Boiler airflow setpoint"
  fan_speed:
    name: "Boiler airflow"
  fan_speed_rpm:
    name: "Boiler fan speed"

  # Power and flow
  ionisation_current:
    name: "Boiler ionisation current"
  available_power:
    name: "Boiler available power"
  desired_max_power:
    name: "Boiler desired max power"
  actual_power:
    name: "Boiler actual power"
  pump_percentage:
    name: "Boiler pump percentage"
  dhw_flowrate:
    name: "Boiler DHW flow rate"

  # The PCU-05 P3 reads water pressure as a switch, not a transducer: its map has
  # no analog pressure field and no pressure-sensor parameter. Low pressure shows
  # up as "Min. water pressure(Blocking 14)" on blocking_text instead. Enable this
  # only if your board turns out to report something that tracks the gauge.
  # hydro_pressure:
  #   name: "Boiler water pressure"

  # Heat demand sources (byte 36)
  demand_source_bit0:
    name: "Boiler Mod.Controller Connected"
  demand_source_bit1:
    name: "Boiler Heat demand from Mod.Controller"
  demand_source_bit2:
    name: "Boiler Heat demand from on-off controller"
  demand_source_bit3:
    name: "Boiler Frost Protection"
  demand_source_bit4:
    name: "Boiler DHW Eco"
  demand_source_bit5:
    name: "Boiler DHW Blocking"
  demand_source_bit6:
    name: "Boiler Anti Legionella"
  demand_source_bit7:
    name: "Boiler DHW Heat Demand"

  # Inputs (byte 37)
  input_bit0:
    name: "Boiler Shutdown Input"
  input_bit1:
    name: "Boiler Release Input"
  input_bit2:
    name: "Boiler Ionisation"
  input_bit3:
    name: "Boiler Flow Switch DHW"
  input_bit5:
    name: "Boiler Min Gas Pressure"
  input_bit6:
    name: "Boiler CH Enable"
  input_bit7:
    name: "Boiler DHW Enable"

  # Valves (byte 38)
  valve_bit0:
    name: "Boiler Gas Valve"
  valve_bit2:
    name: "Boiler Ignition"
  valve_bit3:
    name: "Boiler 3-Way Valve"     # 0 = CH, 1 = DHW
  valve_bit4:
    name: "Boiler Ext. 3-Way Valve"
  valve_bit6:
    name: "Boiler Ext. Gas Valve"

  # Pumps (byte 39)
  pump_bit0:
    name: "Boiler Pump"
  pump_bit1:
    name: "Boiler Calorifier Pump"
  pump_bit2:
    name: "Boiler Ext. CH Pump"
  pump_bit4:
    name: "Boiler Status Report"
  pump_bit7:
    name: "Boiler Opentherm SmartPower"

  # Misc flags (byte 50)
  hru:
    name: "Boiler HRU active"
  ch_timer_enable:
    name: "Boiler CH timer enable"
  dhw_timer_enable:
    name: "Boiler DHW timer enable"

  # Safety unit and HMI, PCU-05 P3 only
  su_state:
    name: "Boiler SU state"
  su_locking:
    name: "Boiler SU locking"
  su_blocking:
    name: "Boiler SU blocking"
  hmi_active:
    name: "Boiler HMI active"
  service_mode:
    name: "Boiler service mode"
  rs232_mode:
    name: "Boiler RS232 mode"

  # Counters - refreshed every 8th poll
  hours_run_pump:
    name: "Boiler hours run pump"
  hours_run_3way:
    name: "Boiler hours run 3-way valve"
  hours_run_ch:
    name: "Boiler hours run CH"
  hours_run_dhw:
    name: "Boiler hours run DHW"
  power_supply_aval_hours:
    name: "Boiler power supply available hours"
  pump_starts:
    name: "Boiler pump starts"
  number_of_3way_valve_cycles:
    name: "Boiler 3-way valve cycles"
  burner_start_dhw:
    name: "Boiler burner starts DHW"
  total_burner_start:
    name: "Boiler total burner starts"
  failed_burner_start:
    name: "Boiler failed burner starts"
  number_flame_loss:
    name: "Boiler flame loss count"

sensor:
  - platform: wifi_signal
    name: "Boiler WiFi Signal"
    update_interval: 60s

  - platform: uptime
    name: "Boiler Uptime"

# ---------------------------------------------------------------------------
# Bring-up buttons for the write path
#
# Commented out along with `allow_writes` above - uncomment both together. Work
# down the list in order: each step is what makes the next one safe to try.
#
# The lambda is compiled into the firmware, so Home Assistant only ever sees a
# button and sends "press". No frame, byte or parameter value crosses the HA
# boundary: the component builds the frame itself, reads the block it is about
# to modify inside the same transaction, clamps the value to the documented
# range, and re-locks service mode whatever happens. Watch the ESPHome log
# while pressing these - that is where the result is reported.
# ---------------------------------------------------------------------------
# button:
#   # 1. Unlock service mode, read one sample while unlocked, re-lock. Writes
#   #    nothing at all. The unlock's ACK carries no payload, so it only proves
#   #    the frame parsed - a sample read while unlocked is what reports whether
#   #    service mode actually engaged. On a PCU-05 P3 the flag is byte 63 (the
#   #    `rs232_mode` sensor), NOT byte 62 (`service_mode`), which stays 0
#   #    throughout - see mapping/pcu05_p3_protocol.md. Look for
#   #      "service mode readback: byte 62 = 0, byte 63 = 1 - the unlock took effect"
#   - platform: template
#     name: "Boiler service mode self-test"
#     entity_category: diagnostic
#     on_press:
#       - lambda: 'id(boiler).test_service_mode();'
#
#   # 2. Read EEPROM block 0x16 and write it straight back, byte for byte. Safe,
#   #    because it changes nothing - but note what it cannot tell you: writing
#   #    identical bytes reads back identical either way, so "identity write
#   #    verified" means the frame was accepted, NOT that the board applied it.
#   #    It stays single-block on purpose, as a frame-level check - on a PCU-05
#   #    P3 a lone block write is expected to be ignored.
#   - platform: template
#     name: "Boiler identity write block 0x16"
#     entity_category: diagnostic
#     on_press:
#       - lambda: 'id(boiler).write_block_unchanged(0x16);'
#
#   # 3. The real thing: p33, the DHW cut-in hysteresis below the tank setpoint.
#   #    With p2 = 56 and p33 = 4 the tank reheats at 52 C; p33 = 6 moves that
#   #    to 50 C, so the burner runs less often for longer. The value is clamped
#   #    to the documented 2..15, and a write is skipped entirely when the
#   #    boiler already holds that value - so pressing this twice costs one
#   #    EEPROM cycle, not two.
#   #
#   #    This writes all eight EEPROM blocks in one service-mode session, as
#   #    Recom does - a PCU-05 P3 ACKs a single-block write and then ignores it.
#   #    That is 26 exchanges and about three seconds, and it borrows one poll
#   #    interval. The freshly read image is range-checked before any of it goes
#   #    back, so a corrupted read is refused rather than written into EEPROM.
#   #    See mapping/pcu05_p3_protocol.md.
#   - platform: template
#     name: "Boiler set DHW hysteresis to 6"
#     entity_category: config
#     on_press:
#       - lambda: 'id(boiler).write_param(33, 6);'
#
#   # Any parameter on the component's writable list works the same way, e.g.
#   # the tank charge temperature (p2, 40..65):
#   #   - lambda: 'id(boiler).write_param(2, 55);'
