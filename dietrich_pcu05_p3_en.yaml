--- # De Dietrich / Remeha boiler with a PCU-05 control board, parameter set P3
#
# The PCU-05 speaks the Remeha protocol (protocol.nr 1 in Recom's
# DeviceConfiguration.xml): 7 byte header, CRC16, and the sample block this
# component decodes. This component targets that board and that parameter set
# only - see the README if yours is an MCR3 or an Avanta/Calenta.
#
# Board here is an ESP32 DevKit V4; for a Wemos D1 (ESP8266) swap the `esp32:`
# block for:
#   esp8266:
#     board: d1_mini
# and put the bus on the hardware UART (tx_pin GPIO1 / rx_pin GPIO3).

esphome:
  name: dietrich-pcu05

esp32:
  board: az-delivery-devkit-v4

wifi:
  ssid: "ssid"
  password: "password"

# NOTE (ESP32): keep the logger on its default UART0/USB console. Do NOT use
# `hardware_uart: UART1` - on classic ESP32 boards UART1 defaults to
# GPIO9/GPIO10, which are wired to the internal SPI flash, and touching them
# crashes the board in a boot loop (see issue #7).
logger:

web_server:

api:

ota:
  platform: esphome

external_components:
  - source: github://peetervalk/esphome_dietrich
    components: [ dietrich ]
  # or locally, when this YAML lives inside a clone of the repository:
  # - source: components

# Boiler bus on UART2 (GPIO16/GPIO17) - leaves UART0 free for the USB console
uart:
  id: uart_bus
  baud_rate: 9600
  tx_pin: GPIO17
  rx_pin: GPIO16

dietrich:
  # needed only so the bring-up buttons at the bottom can reach the component
  id: boiler
  uart_id: uart_bus
  update_interval: 15s

  # Writing to the boiler's EEPROM is off by default and has to be turned on
  # deliberately. With it off, every write method refuses and says so in the
  # log, and the component never unlocks service mode. Read
  # mapping/pcu05_p3_protocol.md before turning it on: the component will not
  # write the gas/air settings or the controller-protection limits at all,
  # because a bad write there is a combustion-safety problem rather than a
  # comfort one.
  
  # allow_writes: true

  # Status registers. The *_text sensors decode the numeric code into the same
  # wording Recom shows, so no template lambdas are needed.
  state:
    name: "Boiler state code"
  state_text:
    name: "Boiler state"
  sub_state:
    name: "Boiler sub state code"
  sub_state_text:
    name: "Boiler sub state"
  lockout:
    name: "Boiler lockout code"
  lockout_text:
    name: "Boiler lockout"
  blocking:
    name: "Boiler blocking code"
  blocking_text:
    name: "Boiler blocking"

  # Temperatures
  flow_temp:
    name: "Boiler flow temp"
  return_temp:
    name: "Boiler return temp"
  # dhw_in_temp and dhw_flowrate are combi (flow-through DHW) fields. On a solo
  # boiler feeding a cylinder through the 3-way valve the sensor is absent, so
  # dhw_in_temp publishes "unknown" and dhw_flowrate sits at 0 - calorifier_temp
  # is the DHW temperature there.
  dhw_in_temp:
    name: "Boiler DHW in temp"
  outside_temp:
    name: "Boiler outside temp"
  # Recom calls byte 8 "Calorifier temp." - a calorifier IS the hot water
  # cylinder, so on a solo boiler feeding a tank this is the DHW tank sensor.
  # Worth renaming to something with "DHW" or "tank" in it, or searching Home
  # Assistant will never surface it. Not to be confused with dhw_in_temp above.
  calorifier_temp:
    name: "Boiler calorifier temp"
  boiler_control_temp:
    name: "Boiler control temp (internal)"
  room_temp:
    name: "Boiler room temp"
  control_temp:
    name: "Boiler control temp"
  solar_temp:
    name: "Boiler solar temp"

  # Setpoints
  ch_setpoint:
    name: "Boiler setpoint CH"
  dhw_setpoint:
    name: "Boiler setpoint DHW"
  room_temp_setpoint:
    name: "Boiler setpoint room"
  # Byte 27, the boiler's LIVE target flow temp, and the single most useful
  # sensor here. Confirmed across a CH burn and a DHW charge on a PCU-05 P3:
  #   no demand at all -> 7.0 C   (frost-protection idle, not a fault)
  #   CH demand        -> tracks ch_setpoint
  #   DHW charge       -> climbs to p2 + p32, well above the tank setpoint
  #   at every ignition it spikes to 90.0 C for one poll
  # So it is emphatically not a copy of ch_setpoint.
  internal_setpoint:
    name: "Boiler internal setpoint"
  ch_setpoint_hmi:
    name: "Boiler setpoint CH (HMI)"
  dhw_setpoint_hmi:
    name: "Boiler setpoint DHW (HMI)"

  # Fan / airflow. Three genuinely different quantities, per Recom's map:
  #   byte 22/24 "Airflow set" / "Airflow" - no unit given in the map
  #   byte 44    "Fan speed"               - explicitly Rpm
  # A full DHW charge (min fire -> 100%) on a PCU-05 P3 pinned the relationship:
  #   fan_speed = 1.0415 x airflow + 642        (fits every sample to ~1 rpm)
  #   min fire  airflow 1182 / fan 1873 rpm
  #   max fire  airflow 4702 / fan 5539 rpm
  # The 642 rpm intercept is almost certainly Recom's "RPM at 0KW" parameter,
  # which makes airflow the power-proportional variable and byte 44 the raw
  # tacho. Multiply airflow by (boiler max kW / airflow at max fire) to get kW.
  fan_speed_setpoint:
    name: "Boiler airflow setpoint"
  fan_speed:
    name: "Boiler airflow"
  fan_speed_rpm:
    name: "Boiler fan speed"

  # Power and flow
  ionisation_current:
    name: "Boiler ionisation current"
  available_power:
    name: "Boiler available power"
  desired_max_power:
    name: "Boiler desired max power"
  # Byte 33 "Actual power" - modulation position within the fan range, not kW
  # and not a fraction of max power:
  #   actual_power = (fan_speed - fan at min fire) / (fan at max - at min) x 100
  # which reproduced every logged sample on a PCU-05 P3 to within 1%. That is
  # why CH cycles at minimum fire correctly read 0-1%: the boiler really is at
  # the bottom of its range there, and nothing is wrong with the decode.
  actual_power:
    name: "Boiler actual power"
  pump_percentage:
    name: "Boiler pump percentage"
  dhw_flowrate:
    name: "Boiler DHW flow rate"

  # The PCU-05 P3 reads water pressure as a switch, not a transducer: Recom's own
  # map has the byte-49 pressure field commented out, and there is no
  # pressure-sensor parameter. Low pressure shows up as "Min. water
  # pressure(Blocking 14)" on blocking_text instead. Enable this only if your
  # board turns out to report something that tracks the gauge.
  # hydro_pressure:
  #   name: "Boiler water pressure"

  # Heat demand sources (byte 36)
  demand_source_bit0:
    name: "Boiler Mod.Controller Connected"
  demand_source_bit1:
    name: "Boiler Heat demand from Mod.Controller"
  demand_source_bit2:
    name: "Boiler Heat demand from on-off controller"
  demand_source_bit3:
    name: "Boiler Frost Protection"
  demand_source_bit4:
    name: "Boiler DHW Eco"
  demand_source_bit5:
    name: "Boiler DHW Blocking"
  demand_source_bit6:
    name: "Boiler Anti Legionella"
  demand_source_bit7:
    name: "Boiler DHW Heat Demand"

  # Inputs (byte 37)
  input_bit0:
    name: "Boiler Shutdown Input"
  input_bit1:
    name: "Boiler Release Input"
  input_bit2:
    name: "Boiler Ionisation"
  input_bit3:
    name: "Boiler Flow Switch DHW"
  input_bit5:
    name: "Boiler Min Gas Pressure"
  input_bit6:
    name: "Boiler CH Enable"
  input_bit7:
    name: "Boiler DHW Enable"

  # Valves (byte 38)
  valve_bit0:
    name: "Boiler Gas Valve"
  valve_bit2:
    name: "Boiler Ignition"
  valve_bit3:
    name: "Boiler 3-Way Valve"     # 0 = CH, 1 = DHW
  valve_bit4:
    name: "Boiler Ext. 3-Way Valve"
  valve_bit6:
    name: "Boiler Ext. Gas Valve"

  # Pumps (byte 39)
  pump_bit0:
    name: "Boiler Pump"
  pump_bit1:
    name: "Boiler Calorifier Pump"
  pump_bit2:
    name: "Boiler Ext. CH Pump"
  pump_bit4:
    name: "Boiler Status Report"
  pump_bit7:
    name: "Boiler Opentherm SmartPower"

  # Misc flags (byte 50)
  hru:
    name: "Boiler HRU active"
  ch_timer_enable:
    name: "Boiler CH timer enable"
  dhw_timer_enable:
    name: "Boiler DHW timer enable"

  # Safety unit and HMI, PCU-05 P3 only
  su_state:
    name: "Boiler SU state"
  su_locking:
    name: "Boiler SU locking"
  su_blocking:
    name: "Boiler SU blocking"
  hmi_active:
    name: "Boiler HMI active"
  service_mode:
    name: "Boiler service mode"
  rs232_mode:
    name: "Boiler RS232 mode"

  # Counters - refreshed every 8th poll
  hours_run_pump:
    name: "Boiler hours run pump"
  hours_run_3way:
    name: "Boiler hours run 3-way valve"
  hours_run_ch:
    name: "Boiler hours run CH"
  hours_run_dhw:
    name: "Boiler hours run DHW"
  power_supply_aval_hours:
    name: "Boiler power supply available hours"
  pump_starts:
    name: "Boiler pump starts"
  number_of_3way_valve_cycles:
    name: "Boiler 3-way valve cycles"
  burner_start_dhw:
    name: "Boiler burner starts DHW"
  total_burner_start:
    name: "Boiler total burner starts"
  failed_burner_start:
    name: "Boiler failed burner starts"
  number_flame_loss:
    name: "Boiler flame loss count"

  # ----------------------------------------------------- stored parameters --
  # Read from EEPROM blocks 0x14..0x1B, not from the sample block: these are the
  # boiler's stored configuration rather than what it is doing right now.
  # Reading them needs no service-mode unlock and no `allow_writes` - it is an
  # ordinary block read. Configuring any of them makes the component spend one
  # poll interval on an 8 request sweep at boot and again roughly every hour, so
  # an edit made at the boiler's own service menu shows up without a reboot.
  #
  # Uncomment the ones you care about; the sweep costs the same either way.
  #
  # p1/p25/p26/p27 are the heating curve, which on this board is a straight line
  # through two points rather than a curve:
  #   flow = p26 + (p1 - p26) x (p25 - T_outside) / (p25 - p27)
  # Factory is (-15 -> 80) .. (20 -> 20).
  # param_ch_max_flow:
  #   name: "P1 max CH flow temp"
  #   entity_category: diagnostic
  # param_curve_foot_outside:
  #   name: "P25 curve footpoint outside"
  #   entity_category: diagnostic
  # param_curve_foot_flow:
  #   name: "P26 curve footpoint flow"
  #   entity_category: diagnostic
  # param_curve_cold_outside:
  #   name: "P27 curve cold-end outside"
  #   entity_category: diagnostic
  # Factory 90; caps whatever the curve asks for.
  # param_max_flow_system:
  #   name: "P23 max system flow temp"
  #   entity_category: diagnostic
  #
  # The DHW tank set. p33 decides when a charge starts, p105 how far past the
  # setpoint it runs before stopping, and p32 how far above the tank setpoint
  # the boiler drives the flow while charging - which is what makes
  # internal_setpoint climb well above p2 during a charge (p2 + p32, exactly).
  # param_dhw_setpoint:
  #   name: "P2 DHW setpoint"
  #   entity_category: diagnostic
  # param_dhw_hysteresis:
  #   name: "P33 DHW hysteresis"
  #   entity_category: diagnostic
  # param_dhw_setpoint_raise:
  #   name: "P32 DHW setpoint raise"
  #   entity_category: diagnostic
  # param_calorifier_offset:
  #   name: "P105 DHW tank offset"
  #   entity_category: diagnostic
  # param_ch_hysteresis:
  #   name: "P73 CH hysteresis"
  #   entity_category: diagnostic
  #
  # Factory 2 min; 99 means the pump runs continuously.
  # param_pump_post_run:
  #   name: "P5 pump post-run"
  #   entity_category: diagnostic
  # p28/p29 are stored as 2..10 and published as per cent, so factory 3 reads
  # back as 30 %. The write path takes per cent too - you type the 40 the sensor
  # will read back, not the 4 Recom numbers it. Only whole tens exist: 45 is
  # refused rather than rounded, because the stored byte cannot hold it.
  # param_pump_ch_min:
  #   name: "P28 pump CH min"
  #   entity_category: diagnostic
  # param_pump_ch_max:
  #   name: "P29 pump CH max"
  #   entity_category: diagnostic

  # Where the write path answers - uncomment along with `allow_writes` and the
  # write section at the bottom. write_result carries the verdict of whatever
  # the write path last did (refusals, progress and success alike) and
  # write_queue lists what is staged. Both are in the ESPHome log too.
  # write_result_text:
  #   name: "Boiler write result"
  # write_queue_text:
  #   name: "Boiler write queue"

sensor:
  - platform: wifi_signal
    name: "Boiler WiFi Signal"
    update_interval: 60s

  - platform: uptime
    name: "Boiler Uptime"

# ---------------------------------------------------------------------------
# Read-only diagnostics
#
# These are live, not commented out, because none of them writes anything or
# touches service mode: READ_EPROM_BLOCK and IDENTIFICATION are plain reads, so
# they work with `allow_writes` off and cannot disturb the boiler. As with the
# write path, the lambda is compiled in - Home Assistant only sends "press".
# ---------------------------------------------------------------------------
button:
  # Who both devices think they are. Sent once at boot anyway; this asks again.
  # 0x01 answers the 16 byte per-device layout - device type, versions,
  # operating hours, connected device types and the last blocking and locking
  # codes. The 64 byte appliance layout carrying the dF/dU codes, serial number
  # and boiler name has not been seen from either address on a live PCU-05 P3 -
  # the component asks both and decodes by reply length; see
  # mapping/pcu05_p3_protocol.md.
  - platform: template
    name: "Boiler identification"
    entity_category: diagnostic
    on_press:
      - lambda: 'id(boiler).read_identification();'

  # Walk the whole 2 KB EEPROM and log every block, hex and ASCII. 128 blocks at
  # roughly a third of a second each, so about 45 seconds, and it borrows the
  # poll intervals it needs. Both addresses have been swept once already and the
  # decode is in mapping/pcu05_p3_eeprom_map.md - parameters at 0x14..0x1B,
  # counters at 0x1C..0x1D (mirrored at 0x1E..0x1F), appliance identification at
  # 0x10..0x13, and the blocking and locking history rings at 0x20..0x3F. Sweep
  # again to see what moved: the fault rings and 0x60..0x64 are the interesting
  # parts.
  - platform: template
    name: "Boiler dump EEPROM 0x00"
    entity_category: diagnostic
    on_press:
      - lambda: 'id(boiler).dump_eeprom(0x00, 0x00, 128);'

  # The same sweep of the other device. The two answer READ_EPROM_BLOCK with
  # different contents - 0x00 holds the parameter image the boiler runs on.
  - platform: template
    name: "Boiler dump EEPROM 0x01"
    entity_category: diagnostic
    on_press:
      - lambda: 'id(boiler).dump_eeprom(0x01, 0x00, 128);'

# ---------------------------------------------------------------------------
# Writing parameters
#
# Commented out along with `allow_writes` above - uncomment both together, and
# the two write_*_text sensors in the dietrich block while you are at it.
#
# The flow is: set parameter and value, press Queue; repeat for as many
# parameters as you want; then press Write. Only the parameter number and the
# value cross the Home Assistant boundary - the component owns the list of
# parameters it is willing to write at all, each one's documented range, the
# read-modify-write, both image CRCs and the re-lock. A parameter that is not on
# its list, or a value outside its range, is refused and reported; values are
# never silently clamped.
#
# A parameter write rewrites and re-verifies the whole 128 byte image whatever it
# is changing, so several queued edits cost exactly what one does - the same
# thirty-odd frames on the bus and the same single EEPROM cycle. Writing them one
# at a time would be one EEPROM cycle each, and one more chance each to provoke
# the blocking a write can bring on.
#
# The verdict is a good half minute behind the press: the transaction takes a
# pre-flight sample, unlocks both addresses, reads eight blocks, writes eight and
# reads all eight back. It shows up on "Boiler write result", first as
# "writing p33=6..." and then as a verdict.
# ---------------------------------------------------------------------------
# switch:
#   - platform: template
#     name: "Boiler write enable"
#     id: write_enable
#     optimistic: true
#     # Off at every boot, deliberately. A UI gate and nothing more: the real
#     # gate is `allow_writes`, compiled in and unreachable from Home Assistant.
#     restore_mode: ALWAYS_OFF
#     entity_category: config
#     turn_on_action:
#       - lambda: 'id(boiler).set_write_enabled(true);'
#     turn_off_action:
#       - lambda: 'id(boiler).set_write_enabled(false);'
#
# globals:
#   # The parameter number behind the dropdown, parsed once when the selection
#   # changes rather than read out of the select inside the button's lambda.
#   # `select::Select` does not expose its state the same way across ESPHome
#   # versions - on 2025.x `.state` is gone and the class is a template - whereas
#   # the `x` handed to on_value has been stable for years. So what the button
#   # reads is a plain uint8_t.
#   #
#   # Starts at 0 deliberately: 0 is not a parameter this component will write,
#   # so a Queue pressed before anything has been picked is refused - "p0
#   # refused: not one of the parameters this component will write" - rather than
#   # staging whatever the dropdown happened to default to.
#   - id: write_param_no
#     type: uint8_t
#     restore_value: false
#     initial_value: '0'
#
# select:
#   # The writable list and nothing else - the component refuses every other
#   # parameter anyway, so a free-text box could only ever produce typos. Each
#   # option carries its documented range, because the value box below cannot
#   # narrow itself per parameter: it has to span -100..255 to cover all of them,
#   # so the range you are allowed has to be readable at the moment you pick.
#   #
#   # Only the leading "p<N>" is parsed. The rest of each line is for you, which
#   # also means this list is a convenience and not the authority - queue_param()
#   # re-checks the number and the range in the firmware. A list gone stale against
#   # a newer component therefore produces a refusal with a reason, never a bad
#   # write.
#   #
#   # * marks the six that live in the image's upper half. That half carries its
#   #   own CRC at image bytes 126..127, which this component maintains, but no
#   #   other writer has been seen maintaining it - Recom's parameter screens stop
#   #   at p44 on this board and its EEPROM menu is greyed out. Writing one of
#   #   these is the experiment that settles whether anything else cares, so watch
#   #   "Write result" and the blocking code after.
#   - platform: template
#     name: "Boiler write parameter"
#     id: write_param_sel
#     optimistic: true
#     entity_category: config
#     # The first option is a placeholder. It parses to 0, which is not a
#     # writable parameter, so the dropdown opens on "nothing picked" and a Queue
#     # pressed before you have chosen is refused rather than quietly acting on a
#     # default.
#     initial_option: "(nothing selected)"
#     on_value:
#       - lambda: |-
#           // Every option starts "p<N>". Skip the p and take digits until the
#           // description begins. Done by hand rather than with strtol/atoi so
#           // this depends on no header the lambda may or may not have.
#           uint8_t n = 0;
#           for (size_t i = 1; i < x.size() && x[i] >= '0' && x[i] <= '9'; i++)
#             n = (uint8_t) (n * 10 + (x[i] - '0'));
#           id(write_param_no) = n;
#     options:
#       - "(nothing selected)"
#       - "p1 - max CH flow temp (20..90)"
#       - "p2 - DHW tank setpoint (40..65)"
#       - "p3 - boiler controls, CH/DHW on/off (0..3)"
#       - "p4 - comfort DHW, always on/off/controller (0..2)"
#       - "p5 - pump post-run CH, minutes, 99 = always (0..99)"
#       - "p23 - max system flow temp (20..90)"
#       - "p25 - curve footpoint outside temp (0..30)"
#       - "p26 - curve footpoint flow temp (0..90)"
#       - "p27 - curve cold-end outside temp (-30..0)"
#       - "p28 - pump CH min speed, % in steps of 10 (20..100)"
#       - "p29 - pump CH max speed, % in steps of 10 (20..100)"
#       - "p30 - min outside temp, frost protection (-30..0)"
#       - "p31 - anti legionella (0..2)"
#       - "p32 - setpoint raise while charging the tank (0..25)"
#       - "p33 - DHW hysteresis, cut-in below tank setpoint (2..15)"
#       - "p61 - offset control temp, tenths of a degree (-100..100)"
#       - "p73 - CH hysteresis (1..10) *"
#       - "p85 - hysteresis warming up, DHW comfort (0..20) *"
#       - "p86 - offset warming up, DHW comfort (-30..20) *"
#       - "p88 - DHW hysteresis, combi/flow-through only (1..10) *"
#       - "p105 - tank switch-off offset (0..10) *"
#       - "p106 - DHW pump switch-on delay (-20..20) *"
#
# number:
#   # `number` rather than `text` so Home Assistant itself will not hand over
#   # something that is not a whole number; `mode: box` makes it a type-in box
#   # rather than a slider. The component checks it against the selected
#   # parameter's range regardless - that is where the real answer comes from.
#
#   # Negative values are real: p27, p30, p61, p86 and p106 are stored two's
#   # complement, and the manual gives it as "setting value - 256 = desired
#   # value" (226 = -30, 246 = -10). Type what the manual says and the component
#   # does the cast. p61 is the most negative at -100.
#   - platform: template
#     name: "Boiler write value"
#     id: write_value
#     optimistic: true
#     min_value: -100
#     max_value: 255
#     step: 1
#     mode: box
#     entity_category: config
#
# button:
#   # Stage whatever is in the two boxes. Touches RAM only, so it needs neither the
#   # write enable switch nor the bus - but the parameter and its range are checked
#   # here, which makes this where a typo gets caught. Queueing a parameter that is
#   # already staged replaces its value.
#   - platform: template
#     name: "Boiler queue parameter"
#     entity_category: config
#     on_press:
#       - lambda: |-
#           id(boiler).queue_param(id(write_param_no), (int) id(write_value).state);
#
#   # Everything staged, in one transaction. Refused unless the write enable
#   # switch is on; the boiler is not required to be idle. The queue survives a
#   # refusal or a failure and is emptied only by a write that reads back
#   # verified, so a retry costs no retyping.
#   - platform: template
#     name: "Boiler write queue to boiler"
#     entity_category: config
#     on_press:
#       - lambda: 'id(boiler).write_queue();'
#
#   - platform: template
#     name: "Boiler clear write queue"
#     entity_category: config
#     on_press:
#       - lambda: 'id(boiler).clear_param_queue();'

# ---------------------------------------------------------------------------
# Bring-up, for a board this component has not been used on before
#
# Neither of these changes a setting, and both are worth a press before the
# write path above is trusted on a new boiler.
#
#   test_service_mode()       unlock, read one sample while unlocked, re-lock.
#                             The unlock ACK carries no payload, so it only
#                             proves the frame parsed - the sample is what says
#                             whether service mode engaged. On a PCU-05 P3 the
#                             flag is byte 63 (`rs232_mode`), NOT byte 62
#                             (`service_mode`), which stays 0 throughout. Look
#                             for "the unlock took effect".
#
#   write_block_unchanged()   read an EEPROM block and write it straight back,
#                             byte for byte. Note what it cannot tell you:
#                             identical bytes read back identical either way, so
#                             "verified" means the frame was accepted, NOT that
#                             the board applied it. A frame-level check only.
# ---------------------------------------------------------------------------
# button:
#   - platform: template
#     name: "Boiler service mode self-test"
#     entity_category: diagnostic
#     on_press:
#       - lambda: 'id(boiler).test_service_mode();'
#
#   - platform: template
#     name: "Boiler identity write block 0x16"
#     entity_category: diagnostic
#     on_press:
#       - lambda: 'id(boiler).write_block_unchanged(0x16);'
